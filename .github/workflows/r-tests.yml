name: R checks

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat
      - name: Run source-only unit tests
        run: Rscript tests/testthat.R

